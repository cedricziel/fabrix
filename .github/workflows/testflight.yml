name: TestFlight

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the triggering ref
        type: string
        required: false
    secrets:
      ASC_KEY_ID: { required: true }
      ASC_ISSUER_ID: { required: true }
      ASC_KEY_CONTENT: { required: true }
      MATCH_GIT_URL: { required: true }
      MATCH_PASSWORD: { required: true }
      MATCH_KEYCHAIN_PASSWORD: { required: true }
      MATCH_DEPLOY_KEY: { required: true }
      REVIEW_CONTACT_FIRST_NAME: { required: false }
      REVIEW_CONTACT_LAST_NAME: { required: false }
      REVIEW_CONTACT_PHONE: { required: false }
      REVIEW_CONTACT_EMAIL: { required: false }
      OTLP_ENDPOINT: { required: false }
      OTLP_API_KEY: { required: false }

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Configure SSH for match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
          REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
          REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
          REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
          OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
          OTLP_API_KEY: ${{ secrets.OTLP_API_KEY }}
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane ${{ matrix.platform }} release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fastlane-${{ matrix.platform }}
          path: |
            build/fastlane/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
