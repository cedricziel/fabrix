name: Fabrix

options:
  bundleIdPrefix: com.cedricziel
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2.0" # x-release-please-version
    DEVELOPMENT_TEAM: WPW3QSLZ2F
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.fabrix

configFiles:
  Debug: Config/Telemetry.xcconfig
  Release: Config/Telemetry-Release.xcconfig

packages:
  FabrixKit:
    path: Packages/FabrixKit

targets:
  FabrixiOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: FabrixKit
        product: FabrixFeatures
      - package: FabrixKit
        product: FabrixTelemetry
    entitlements:
      path: App/iOS/FabrixiOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cedricziel.fabrix
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Fabrix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Fabrix connects to Paperclip factories running on your local network.
        FabrixOTLPEndpoint: $(OTLP_ENDPOINT)
        FabrixOTLPAPIKey: $(OTLP_API_KEY)
        FabrixOTLPTenantID: $(OTLP_TENANT_ID)
        FabrixOTLPDatasetID: $(OTLP_DATASET_ID)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false

  FabrixMac:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: FabrixKit
        product: FabrixFeatures
      - package: FabrixKit
        product: FabrixTelemetry
    entitlements:
      path: App/macOS/FabrixMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cedricziel.fabrix
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Fabrix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FabrixOTLPEndpoint: $(OTLP_ENDPOINT)
        FabrixOTLPAPIKey: $(OTLP_API_KEY)
        FabrixOTLPTenantID: $(OTLP_TENANT_ID)
        FabrixOTLPDatasetID: $(OTLP_DATASET_ID)
    settings:
      base:
        PRODUCT_NAME: Fabrix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true

schemes:
  FabrixiOS:
    build:
      targets:
        FabrixiOS: all
    test:
      gatherCoverageData: true
  FabrixMac:
    build:
      targets:
        FabrixMac: all
